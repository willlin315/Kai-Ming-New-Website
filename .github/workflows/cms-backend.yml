name: CMS API
on:
  pull_request:
  push:
    branches: [nextjs-photo-migration]
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cms_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: cms_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U cms_test -d cms_test"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run cms:test
        env:
          TEST_DATABASE_URL: postgresql://cms_test:ci-test-only@127.0.0.1:5432/cms_test?sslmode=disable

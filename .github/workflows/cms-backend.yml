name: CMS backend
on:
  pull_request:
  push:
    branches: [feat/cms-editor, nextjs-photo-migration]
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cms_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: cms_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U cms_test -d cms_test"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://cms_test:ci-test-only@127.0.0.1:5432/cms_test

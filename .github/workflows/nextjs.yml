name: Validate Next.js website
on:
  push:
    branches: [main, nextjs-photo-migration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Kai-Ming-New-Website
          SITE_URL: https://willlin315.github.io
      - uses: actions/upload-artifact@v4
        with:
          name: nextjs-static-preview
          path: out

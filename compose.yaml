# Optional local PostgreSQL. Run the site with: DATABASE_URL=postgresql://cms:<password>@127.0.0.1:5432/km_cms?sslmode=disable npm run dev
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: km_cms
    volumes:
      - cms-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d km_cms"]
      interval: 5s
      retries: 10
volumes:
  cms-postgres:

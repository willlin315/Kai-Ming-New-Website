services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: km_cms
    volumes:
      - cms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d km_cms"]
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CMS_ENV: development
      DATABASE_URL: postgresql+psycopg://cms:${POSTGRES_PASSWORD}@db:5432/km_cms
      CMS_DEV_TOKEN: ${CMS_DEV_TOKEN:?Set CMS_DEV_TOKEN in .env}
      CMS_ALLOWED_ORIGINS: ${CMS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  cms-postgres:

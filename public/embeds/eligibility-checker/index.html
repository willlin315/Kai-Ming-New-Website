<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:Oswald,'Noto Sans TC',Arial,sans-serif;color:#1d2a33;font-weight:300}
.wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;padding:4px}
.card{background:#F4F8FB;border-radius:18px;padding:26px 28px}
h2{font-weight:500;font-size:26px;margin:0 0 4px;color:#0F4D6B}
.sub{font-size:16px;margin:0 0 18px;color:#44545f}
h3{font-weight:500;font-size:19px;margin:0 0 12px;color:#5092B3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #dbe6ee;border-radius:12px;padding:10px 12px;font-size:15.5px;line-height:1.3;cursor:pointer;user-select:none;min-height:58px;transition:border-color .15s,background .15s}
.opt input{width:20px;height:20px;accent-color:#0F4D6B;flex:none;margin:0}
.opt.on{border-color:#0F4D6B;background:#EAF2F8}
.opt.none{grid-column:1/-1;min-height:46px}
.step2{margin-top:22px;opacity:.4;pointer-events:none;transition:opacity .2s}
.step2.active{opacity:1;pointer-events:auto}
.row{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}
label.f{display:block;font-size:15px;margin-bottom:6px;color:#44545f}
select,input.num{width:100%;height:46px;border:2px solid #dbe6ee;border-radius:10px;padding:0 12px;font-family:inherit;font-size:17px;background:#fff;color:#1d2a33}
select:focus,input.num:focus{outline:none;border-color:#5092B3}
.money{position:relative}.money span{position:absolute;left:12px;top:11px;font-size:17px;color:#6b7b86}.money input{padding-left:26px}
.per{display:flex;gap:6px;margin-top:8px}
.per button{flex:1;height:34px;border-radius:17px;border:2px solid #dbe6ee;background:#fff;font-family:inherit;font-size:14.5px;cursor:pointer;color:#44545f}
.per button.on{background:#0F4D6B;border-color:#0F4D6B;color:#fff}
.go{margin-top:16px;width:100%;height:50px;border:0;border-radius:25px;background:#0F4D6B;color:#fff;font-family:inherit;font-size:18px;letter-spacing:.04em;cursor:pointer}
.go:hover{background:#689ADE}
.note{font-size:13.5px;color:#6b7b86;margin-top:10px;line-height:1.45}
.res{display:flex;flex-direction:column;justify-content:center;min-height:100%;text-align:center}
.res .ic{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;background:#b9c7d1}
.res .tag{display:inline-block;margin:0 auto 10px;padding:4px 14px;border-radius:14px;font-size:14px;font-weight:500;letter-spacing:.05em;background:#e6edf2;color:#44545f}
.res h4{font-weight:500;font-size:23px;margin:0 0 10px;color:#0F4D6B;line-height:1.3}
.res p{font-size:16px;line-height:1.55;margin:0 0 14px;color:#34434d}
.res.free .ic{background:#3A9D5D}.res.free .tag{background:#F7E078;color:#3d3300}
.res.full .ic{background:#3A9D5D}.res.full .tag{background:#F7E078;color:#3d3300}
.res.half .ic{background:#5092B3}.res.half .tag{background:#dcebf4;color:#0F4D6B}
.res.over .ic{background:#8a9aa5}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.cta button{height:44px;padding:0 22px;border-radius:22px;border:2px solid #0F4D6B;font-family:inherit;font-size:16px;cursor:pointer;letter-spacing:.03em}
.cta .p{background:#0F4D6B;color:#fff}.cta .s{background:#fff;color:#0F4D6B}
.cta button:hover{background:#689ADE;border-color:#689ADE;color:#fff}
.tbl{grid-column:1/-1}
.tbl h3{margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:15.5px;background:#fff;border-radius:12px;overflow:hidden}
th,td{padding:9px 12px;text-align:center;border-bottom:1px solid #e6edf2}
th{background:#0F4D6B;color:#fff;font-weight:400;font-size:14.5px;line-height:1.3}
th small{display:block;font-size:12px;opacity:.85}
td:first-child{font-weight:500;color:#0F4D6B}
tr.hl td{background:#FFF6CF}
.src{font-size:13px;color:#6b7b86;margin-top:8px}.src a{color:#5092B3}
@media (max-width:700px){
 .wrap{grid-template-columns:1fr;gap:18px;padding:0}
 .card{padding:20px 16px;border-radius:14px}
 h2{font-size:22px}.opts{grid-template-columns:1fr}.opt{min-height:50px;font-size:15px}
 .row{grid-template-columns:1fr}
 .res{min-height:260px}
 table{font-size:13.5px} th,td{padding:7px 4px} th{font-size:12.5px}
}
</style></head><body>
<div class="wrap">
 <div class="card">
  <h2 data-t="title"></h2>
  <p class="sub" data-t="sub"></p>
  <h3 data-t="q1"></h3>
  <div class="opts" id="opts"></div>
  <div class="step2" id="step2">
   <h3 data-t="q2"></h3>
   <div class="row">
    <div><label class="f" for="size" data-t="size"></label><select id="size"></select></div>
    <div><label class="f" for="inc" data-t="income"></label>
     <div class="money"><span>$</span><input id="inc" class="num" inputmode="numeric" autocomplete="off"></div>
     <div class="per"><button type="button" id="py" class="on" data-t="year"></button><button type="button" id="pm" data-t="month"></button></div>
    </div>
   </div>
   <button class="go" id="go" type="button" data-t="check"></button>
   <div class="note" data-t="sfnote"></div>
  </div>
 </div>
 <div class="card"><div class="res" id="res"></div></div>
 <div class="card tbl">
  <h3 data-t="tblTitle"></h3>
  <p class="sub" style="margin-bottom:12px" data-t="tblSub"></p>
  <table><thead><tr><th data-t="thSize"></th><th><span data-t="thFree"></span><small>≤110% AMI</small></th><th><span data-t="thFull"></span><small>≤150% AMI</small></th><th><span data-t="thHalf"></span><small>≤200% AMI</small></th></tr></thead><tbody id="tb"></tbody></table>
  <div class="src"><span data-t="src"></span> <a href="https://www.sf.gov/eligibility-for-free-or-low-cost-preschool-and-child-care" target="_blank" rel="noopener">SF.gov – Department of Early Childhood</a></div>
 </div>
</div>

var L={

q2:"2. Check by household income",size:"Family size",income:"Household income (before taxes)",year:"Per year",month:"Per month",check:"See my result",

"zh-hk":{title:"30 秒了解您的家庭是否符合資格",sub:"只需回答兩條簡單問題，就能知道孩子是否可以免費或以優惠學費入學。",

q1:"1. ¿Alguna de estas situaciones aplica a su familia?",c:["Estamos sin hogar","Recibimos asistencia pública (TANF, SSI, WIC, CalFresh, SNAP)","Mi hijo está en un hogar de crianza (foster care)","Mi hijo recibe Servicios de Protección Infantil (CPS)"],none:"Ninguna aplica a nuestra familia",

// SF DEC Early Learning For All FY2026-27 yearly income limits (110% / 150% / 200% AMI)
var T={2:[142650,194550,259400],3:[160500,218850,291800],4:[178300,243150,324200],5:[192550,262600,350100],6:[206850,282100,376100],7:[221100,301500,402000],8:[235350,320950,427900],9:[249650,340450,453900],10:[263900,359850,479800]};
var lang='en',sel=[],none=false,per='y',last=null;
function q(s){return document.querySelector(s)}
function fm(v){return '$'+v.toLocaleString('en-US')}
function t(){return L[lang]||L.en}
function render(){var d=t();document.documentElement.lang=lang;
 document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=d[e.getAttribute('data-t')]});
 var o=q('#opts');o.innerHTML='';
 d.c.forEach(function(txt,i){o.appendChild(mk(txt,sel.indexOf(i)>=0,function(){var k=sel.indexOf(i);if(k>=0)sel.splice(k,1);else sel.push(i);none=false;upd()}))});
 var n=mk(d.none,none,function(){none=!none;if(none)sel=[];upd()});n.classList.add('none');o.appendChild(n);
 var s=q('#size'),cur=s.value||'4';s.innerHTML='';for(var k=2;k<=10;k++){var op=document.createElement('option');op.value=k;op.textContent=(k==2?'1–2':k)+' '+d.p;s.appendChild(op)}s.value=cur;
 var tb=q('#tb');tb.innerHTML='';for(var k=2;k<=10;k++){var r=T[k];var tr=document.createElement('tr');tr.id='r'+k;tr.innerHTML='<td>'+(k==2?'1–2':k)+'</td><td>'+fm(r[0])+'</td><td>'+fm(r[1])+'</td><td>'+fm(r[2])+'</td>';tb.appendChild(tr)}
 upd(true)}
function mk(txt,on,fn){var l=document.createElement('label');l.className='opt'+(on?' on':'');var c=document.createElement('input');c.type='checkbox';c.checked=on;c.onchange=fn;l.appendChild(c);l.appendChild(document.createTextNode(txt));return l}
function upd(keep){var d=t();
 document.querySelectorAll('#opts .opt').forEach(function(e,i){var on=i<d.c.length?sel.indexOf(i)>=0:none;e.classList.toggle('on',on);e.querySelector('input').checked=on});
 q('#step2').classList.toggle('active',none);
 if(sel.length){show('cat')}else if(none&&last&&last!='cat'&&keep){show(last)}else if(none&&last&&last!='cat'){compute()}else{show(none?'wait2':null)}}
function show(k,extra){last=k;var d=t(),r=q('#res'),h='';
 document.querySelectorAll('#tb tr').forEach(function(e){e.classList.remove('hl')});
 if(k&&k!='wait2'&&k!='cat'&&k!='need'){var sz=q('#size').value;var tr=q('#r'+sz);if(tr)tr.classList.add('hl')}
 if(!k||k=='wait2'||k=='need'){r.className='res';h='<div class="ic">?</div><h4>'+(k=='need'?d.need:d.ph)+'</h4><p>'+(k=='wait2'?d.q2:(k=='need'?'':d.phs))+'</p>'}
 else{var map={cat:['free',d.tFree,d.catH,d.catP,'✓'],free:['free',d.tFree,d.freeH,d.freeP,'✓'],full:['full',d.tFull,d.fullH,d.fullP,'✓'],half:['half',d.tHalf,d.halfH,d.halfP,'✓'],over:['over','',d.overH,d.overP,'i']}[k];
  var sz=q('#size').value,p=map[3].replace('{n}',sz==2?'1–2':sz).replace('{a}',fm(T[sz][0]));
  r.className='res '+map[0];h='<div class="ic">'+map[4]+'</div>'+(map[1]?'<span class="tag">'+map[1]+'</span>':'')+'<h4>'+map[2]+'</h4><p>'+p+'</p><div class="cta"><button class="p" data-go="apply">'+d.apply+'</button><button class="s" data-go="inquiry">'+d.inq+'</button></div><div class="note">'+d.est+'</div>'}
 r.innerHTML=h;
 r.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){try{window.parent.postMessage({kmElig:'go',to:b.getAttribute('data-go')},'*')}catch(e){}}});
 if(window.innerWidth<=700&&k&&k!='wait2'&&!extra){r.scrollIntoView({behavior:'smooth',block:'center'})}}
function compute(){var raw=(q('#inc').value||'').replace(/[^0-9.]/g,'');if(!raw){show('need');return}
 var v=parseFloat(raw);if(per=='m')v=v*12;var r=T[q('#size').value];show(v<=r[0]?'free':v<=r[1]?'full':v<=r[2]?'half':'over')}
q('#go').onclick=compute;
q('#inc').addEventListener('input',function(){var raw=this.value.replace(/[^0-9]/g,'');this.value=raw?parseInt(raw,10).toLocaleString('en-US'):''});
q('#inc').addEventListener('keydown',function(e){if(e.key=='Enter')compute()});
q('#size').onchange=function(){if(last&&last!='cat'&&last!='wait2'&&last!='need')compute()};

q('#pm').onclick=function(){per='m';this.classList.add('on');q('#py').classList.remove('on')};

try{var ql=(location.search.match(/lang=([\w-]+)/)||[])[1];if(ql&&L[ql])lang=ql}catch(e){}
